version: "2"
type: frontend
tech_stack:
  - TypeScript
  - SvelteKit 2
  - Svelte 5
  - Vite
  - Tailwind CSS 4
  - shadcn-svelte
  - Bits UI
  - Playwright
  - Bun adapter/runtime
routes:
  - path: /
    file: src/routes/+page.svelte
    auth_required: false
    description: Main academic management app; unauthenticated users see the login form, authenticated users access dashboards and entity management views.
  - path: /health
    file: src/routes/health/+server.ts
    auth_required: false
    description: Health check endpoint.
  - path: /ready
    file: src/routes/ready/+server.ts
    auth_required: false
    description: Readiness check endpoint.
  - path: /auth/refresh
    file: src/routes/auth/refresh
    auth_required: false
    description: Refreshes authentication state/access token.
  - path: /demo/playwright
    file: src/routes/demo/playwright
    auth_required: false
    description: Demo route used by Playwright smoke tests.
  - path: /demo
    file: src/routes/demo/+page.svelte
    auth_required: false
    description: Demo page route.
  - path: /docs
    file: src/routes/docs/+layout.svelte
    auth_required: false
    description: Documentation section layout.
  - path: /test
    file: src/routes/test/+page.svelte
    auth_required: false
    description: Internal test route expected to be unavailable in production preview.
features:
  - name: Authentication
    description: Users sign in from the root route and the app maintains access tokens through client auth helpers and refresh endpoints.
    files:
      - src/routes/+page.svelte
      - src/lib/client/auth
      - src/routes/auth/refresh
      - src/routes/auth/data.remote.ts
    entry_route: /
    user_interactions:
      - Open the root route while unauthenticated
      - Fill the email input
      - Fill the password input
      - Submit the login form
      - See dashboard content after successful login or an error after invalid credentials
    api_calls:
      - method: POST
        endpoint: /auth/refresh
    auth_required: false
  - name: Academic Dashboard
    description: Authenticated users view summary cards, upcoming schedules, and conflict indicators for academic operations.
    files:
      - src/routes/+page.svelte
      - src/lib/app/view-prop-builders
      - src/lib/app/academic
      - src/lib/app/calendar-schedules
    entry_route: /
    user_interactions:
      - Log in
      - Review dashboard summary information
      - Navigate between role-appropriate navigation groups
      - Inspect schedule and conflict status cards
    api_calls: []
    auth_required: true
  - name: Faculty Management
    description: Authenticated users browse, search, create, edit, and delete faculty records.
    files:
      - src/routes/+page.svelte
      - src/routes/faculties/data.remote.ts
      - src/lib/app/form-drafts
      - src/lib/app/view-prop-builders
    entry_route: /
    user_interactions:
      - Navigate to Faculties
      - Search faculty records
      - Open create or edit form
      - Fill faculty fields
      - Save changes
      - Delete selected faculty records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/faculties/data.remote.ts
    auth_required: true
  - name: Study Program Management
    description: Authenticated users manage study programs and associate them with faculties.
    files:
      - src/routes/+page.svelte
      - src/routes/study-programs/data.remote.ts
      - src/lib/app/form-drafts
      - src/lib/app/option-list-refresh
    entry_route: /
    user_interactions:
      - Navigate to Study Programs
      - Search study programs
      - Create or edit a study program
      - Select related faculty options
      - Save or delete records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/study-programs/data.remote.ts
    auth_required: true
  - name: Course Management
    description: Authenticated users manage courses, search/paginate course lists, and maintain course metadata.
    files:
      - src/routes/+page.svelte
      - src/routes/courses/data.remote.ts
      - src/lib/app/form-drafts
      - src/lib/app/search-requesters
    entry_route: /
    user_interactions:
      - Navigate to Courses
      - Search course records
      - Create or edit a course
      - Save changes
      - Delete one or more courses
    api_calls:
      - method: REMOTE
        endpoint: src/routes/courses/data.remote.ts
    auth_required: true
  - name: Lecturer Management
    description: Authenticated users manage lecturers and related academic profile data.
    files:
      - src/routes/+page.svelte
      - src/routes/lecturers/data.remote.ts
      - src/lib/app/form-drafts
    entry_route: /
    user_interactions:
      - Navigate to Lecturers
      - Search lecturer records
      - Create or edit lecturer details
      - Save or delete lecturer records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/lecturers/data.remote.ts
    auth_required: true
  - name: Student Management
    description: Authenticated users manage students and related study program assignments.
    files:
      - src/routes/+page.svelte
      - src/routes/students/data.remote.ts
      - src/lib/app/form-drafts
      - src/lib/app/option-list-refresh
    entry_route: /
    user_interactions:
      - Navigate to Students
      - Search students
      - Create or edit a student
      - Select related study program data
      - Save or delete student records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/students/data.remote.ts
    auth_required: true
  - name: Classroom Management
    description: Authenticated users manage classrooms, room types, and room capacity data.
    files:
      - src/routes/+page.svelte
      - src/routes/classrooms/data.remote.ts
      - src/lib/validations/classroom
      - src/lib/app/academic
    entry_route: /
    user_interactions:
      - Navigate to Classrooms
      - Search classrooms
      - Create or edit a classroom
      - Choose room type and capacity fields
      - Save or delete classroom records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/classrooms/data.remote.ts
    auth_required: true
  - name: Enrollment Management
    description: Authenticated users create and manage class enrollments with schedule, room availability, and conflict-aware behavior.
    files:
      - src/routes/+page.svelte
      - src/routes/enrollments/data.remote.ts
      - src/lib/app/enrollment-policy
      - src/lib/app/enrollment-query
      - src/lib/app/calendar-schedules
    entry_route: /
    user_interactions:
      - Navigate to Enrollments
      - Search and filter enrollments
      - Create or edit enrollment details
      - Choose course, lecturer, student, room, day, and time slot fields
      - Review conflict or availability feedback
      - Save or delete enrollment records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/enrollments/data.remote.ts
    auth_required: true
  - name: Grade Management
    description: Authenticated users manage student grades and calculate grade results.
    files:
      - src/routes/+page.svelte
      - src/routes/grades/data.remote.ts
      - src/lib/validations/grade
      - src/lib/app/form-drafts
    entry_route: /
    user_interactions:
      - Navigate to Grades
      - Search grade records
      - Create or edit grade inputs
      - Review calculated grade outcome
      - Save or delete grade records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/grades/data.remote.ts
    auth_required: true
  - name: User Management
    description: Authorized users manage application users, roles, and credentials.
    files:
      - src/routes/+page.svelte
      - src/routes/users/data.remote.ts
      - src/lib/app/view-prop-builders
      - src/lib/app/form-drafts
    entry_route: /
    user_interactions:
      - Navigate to Users
      - Search users
      - Create or edit user records
      - Assign role or identity fields
      - Save or delete user records
    api_calls:
      - method: REMOTE
        endpoint: src/routes/users/data.remote.ts
    auth_required: true
  - name: Schedule Calendar And Conflict Audit
    description: Authenticated users inspect weekly schedules, room availability, and detected scheduling conflicts.
    files:
      - src/routes/+page.svelte
      - src/lib/app/calendar-schedules
      - src/lib/app/academic
      - src/lib/app/enrollment-query
    entry_route: /
    user_interactions:
      - Navigate to calendar or conflict audit views
      - Filter schedules or conflicts
      - Review room and session cards
      - Inspect conflict explanations
      - Clear or navigate from conflict details where available
    api_calls:
      - method: REMOTE
        endpoint: src/routes/enrollments/data.remote.ts
    auth_required: true
  - name: Responsive Navigation And Theme
    description: Users can open mobile navigation, switch theme, and navigate between app sections.
    files:
      - src/routes/+page.svelte
      - src/lib/app/navigation
    entry_route: /
    user_interactions:
      - Open and close sidebar or mobile menu
      - Switch between light and dark theme
      - Select navigation items
      - Confirm page heading and action controls update
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Most authenticated app features require valid seed data and database connectivity, so unauthenticated TestSprite runs may be limited to login, public demo, and health/readiness coverage.
    location: src/routes/+page.svelte and .env.example
    impact: Full CRUD and calendar flows may not be reachable without credentials and a running MySQL database seeded with usable users.
  - issue: /test is an internal route that is expected to return 404 in production preview.
    location: src/routes/test/+page.svelte
    impact: Production frontend testing should not treat /test as a public navigable page.
